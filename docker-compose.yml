services:
  git-tools-api:
    build:
      context: .
    container_name: git-tools-api
    ports:
      - "${GIT_API_PORT:-8000}:8000"
    environment:
      GIT_API_DATA_DIR: /app/data
      GIT_API_HOME: /app/data/home
      GIT_API_WORKSPACE_ROOT: /workspace
      GIT_API_DEFAULT_KEY_NAME: default
      GIT_API_INIT_KEY_NAME: ${GIT_API_INIT_KEY_NAME:-default}
      GIT_API_INIT_HOST: ${GIT_API_INIT_HOST:-github.com}
      GIT_API_INIT_HOST_ALIAS: ${GIT_API_INIT_HOST_ALIAS:-}
      GIT_API_INIT_USER: ${GIT_API_INIT_USER:-git}
      GIT_API_INIT_EMAIL: ${GIT_API_INIT_EMAIL:-}
      GIT_API_INIT_PRIVATE_KEY: ${GIT_API_INIT_PRIVATE_KEY:-}
      GIT_API_INIT_PRIVATE_KEY_B64: ${GIT_API_INIT_PRIVATE_KEY_B64:-}
    volumes:
      - ./data:/app/data
      - ./workspace:/workspace
    restart: unless-stopped
